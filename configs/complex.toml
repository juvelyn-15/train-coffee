model_name = "complex_cnn"
epochs = 20
batch_size = 32
learning_rate = 0.001
block_filters = [32, 64, 128, 256]
block_dropout = 0.2
dense_units = 256
dense_dropout = 0.5

[augmentation]
rotation_range = 15
width_shift_range = 0.05
height_shift_range = 0.05
horizontal_flip = true
vertical_flip = true
brightness_range = [0.9, 1.1]
