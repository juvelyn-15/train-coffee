model_name = "transfer_learning"
backbone = "MobileNetV2"
weights = "imagenet"
epochs = 10
batch_size = 32
learning_rate = 0.001
fine_tune_layers = 0
dropout = 0.3

[augmentation]
rotation_range = 15
width_shift_range = 0.05
height_shift_range = 0.05
horizontal_flip = true
vertical_flip = true
brightness_range = [0.9, 1.1]
